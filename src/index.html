<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' https: http: data:; media-src https: http: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none';"/>
  <title>HYWmusic</title>
  <link rel="icon" href="assets/favicon.ico"/>
  <link rel="stylesheet" href="css/theme.css"/>
  <link rel="stylesheet" href="css/player.css"/>
</head>
<body>
  <!-- 启动动画 -->
  <div class="boot" id="boot">
    <div class="boot__logo">
      <img src="assets/logo-128.png" alt="HYWmusic"/>
    </div>
    <div class="boot__name">HYWmusic</div>
    <div class="boot__bar"><i></i></div>
  </div>

  <div id="app"></div>

  <!-- 音频引擎 -->
  <audio id="audio" preload="metadata"></audio>

  <div class="toasts" id="toasts"></div>

  <script src="js/icons.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/api.js"></script>
  <script src="js/lyrics.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
